name: Publish Colosseum Inspired Overhaul V2 cart

on:
  push:
    branches: [main]
    paths:
      - '.publish-v2-cart-release'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify cart package
        shell: bash
        run: |
          set -euo pipefail
          CART='colosseum_inspired_overhaul_v2-1.0.0.g1rcart'
          test -s "$CART"
          grep -q 'id = "colosseum_inspired_overhaul_v2"' "$CART"
          grep -q 'base = "crystal"' "$CART"
          grep -q 'version = "1.0.0"' "$CART"
          grep -q 'repo = "absol89/Gen2Recomped-DramaticShapes"' "$CART"
          grep -q 'sha256 = "fe3292fb4f8f29e105f397e353d3c32611c23af2123a4146632c524ea9fdc0d8"' "$CART"
          if grep -q 'source = "local"' "$CART"; then
            echo 'V2 cart still contains a local-only mod pin.' >&2
            exit 1
          fi
          sha256sum "$CART" > sha256sums.txt

      - name: Create or refresh V2 cart release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0
          CART: colosseum_inspired_overhaul_v2-1.0.0.g1rcart
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Fully launcher-installable Pokémon Crystal custom-cart configuration. Battle Art 2.0.1, CBE 1.6.1, Colosseum UI 2.2.1, and Exp Share 0.1.7 are exact GitHub pins with SHA-256 verification. Import the .g1rcart, use Install Cart Mods, then launch the configured Crystal setup.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$CART" sha256sums.txt --clobber
            gh release edit "$TAG" \
              --title 'Colosseum Inspired Overhaul V2 cart 1.0.0' \
              --notes "$NOTES"
          else
            gh release create "$TAG" "$CART" sha256sums.txt \
              --target main \
              --title 'Colosseum Inspired Overhaul V2 cart 1.0.0' \
              --notes "$NOTES"
          fi
